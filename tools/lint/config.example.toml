# 消费仓只保留一份 .config/lint.toml；本例的公开符号/路径排除属于 bbtools 策略。
schema_version = 2
timeout_seconds = 60
enforce_blocks = true

[scan]
rules = ["T101", "T102", "T201", "T301", "T302", "T303", "T304", "T401", "T501", "T601"]
# 严格使用 bbtools 协程语法糖的仓库，将 coroutine-sugar 加入 scan.rules、commit.rules 和 push.rules。

# T 规则只放 scan：hook 中遇到条件编译（#if/#ifdef）或复杂宏会判为解析不完整并 exit 2，warn 不能降级。
[commit]
rules = ["whitespace", "format", "comment-form", "template-layout", "retired-symbol", "header-implementation"]

[push]
rules = ["whitespace", "format", "comment-form", "template-layout", "retired-symbol", "header-implementation", "review-ticket", "llm-review", "secrets"]

# 只列本模块已经明确退役的名字。精确作用域可覆盖 scope 中的测试排除。
[[retired]]
path = "bbt/infra/rpc/*"
symbols = ["ServerV2LedgerForTest"]

[[retired]]
path = "tests/*"
symbols = ["ServerV2LedgerForTest"]

# 目录布局规则默认关闭：不把 new-root / third-party-layout 列入 commit.rules 或 push.rules 时，本表完全不参与检查。
# 启用时两个名单都不能为空，且只接受精确路径（不用 glob）；示例值是占位，按本仓实际目录填写。
# [layout]
# allowed_roots = ["tooling", "third-party"]
# allowed_gitlinks = ["third-party/example-dep"]

[scope]
exclude = ["tests/*", "*/tests/*", "proto/*", "*/proto/*", "*.pb.h", "*.pb.cc"]

[format]
binary = "clang-format"

[rules.T101]
level = "warn"
options = { fields = 10 }

[rules.T201]
level = "warn"
options = { short_comment_chars = 48 }

# T202 默认关闭；需要人工复核时将 ID 加入 scan.rules，不建议自动删除注释。
[rules.T202]
level = "warn"
options = { short_comment_chars = 48 }

[rules.T301]
options = { file_lines = 1000 }

[rules.T401]
options = { forwarders = 2 }

[rules.T501]
level = "warn"

[[exclude]]
rule = "T501"
path = "*"
symbol = "kRpcV2*"
reason = "bbtools RPC 公开常量属于兼容契约，不是内部迁移名"

